<!--
  Reparasjonsvisning: ny innlogging mot Nest.

  Åpnes fra enhetens meny: Reparer. Homey viser valget så lenge driveren har
  en repair-visning, også når enheten er tilgjengelig. Det er der brukeren
  leter når varslerne slutter å oppdatere, ikke i appinnstillingene.

  Legitimasjonen er app-global, så dette gjenoppretter alle varslerne samtidig.
  Det står i teksten, slik at ingen tror de må reparere sju ganger.

  Homey injiserer homey.js selv — ikke legg den inn her.
-->
<style>
  .np { padding: 0 16px; line-height: 1.5; overflow-x: hidden; }
  .np * { max-width: 100%; box-sizing: border-box; }
  .np p.intro { margin: 0 0 4px; font-size: 0.92em; }
  .np p.scope { margin: 0 0 14px; font-size: 0.85em; opacity: 0.7; }
  .np label { display: block; margin: 14px 0 4px; font-size: 0.9em; opacity: 0.75; }
  .np textarea { width: 100%; min-height: 74px; padding: 9px 10px;
              font-family: ui-monospace, monospace; font-size: 0.72em; line-height: 1.4;
              border: 1px solid rgba(128,128,128,0.4); border-radius: 6px;
              background: transparent; color: inherit; resize: vertical; }
  .np .buttons { display: flex; gap: 10px; margin-top: 18px; }
  .np .buttons button { flex: 1; padding: 11px; font-size: 0.95em; border-radius: 6px;
              cursor: pointer; border: 1px solid rgba(128,128,128,0.4);
              background: transparent; color: inherit; }
  .np .buttons button.primary { background: #1f8fff; border-color: #1f8fff; color: #fff; }
  .np button[disabled] { opacity: 0.5; cursor: default; }
  .np #result { margin-top: 16px; white-space: pre-wrap; font-size: 0.88em; min-height: 1.2em; }
  .np #result.bad { color: #c0392b; }
  .np #result.ok { color: #1a8a3c; }
  .np details { margin-top: 16px; font-size: 0.85em; line-height: 1.55; }
  .np summary { cursor: pointer; opacity: 0.75; }
  .np ol { padding-left: 20px; margin: 8px 0 0; }
  .np li { margin-bottom: 5px; }
  .np .addon { border: 1px solid rgba(31,143,255,0.45); border-radius: 8px;
              padding: 10px 12px; margin: 0 0 4px; font-size: 0.85em; }
  .np .addon b { display: block; }
  .np .addon ol { margin-top: 4px; }
  .np .addon a { color: #1f8fff; }
  .np ul { padding-left: 20px; margin: 8px 0 0; }
  .np .chrome-warn { border-left: 3px solid #c0392b; background: rgba(192,57,43,0.10);
              padding: 8px 10px; border-radius: 6px; margin: 10px 0 0; font-size: 0.82em; }
  .np .why { background: rgba(128,128,128,0.12); border-radius: 8px; padding: 9px 11px;
              margin-top: 16px; font-size: 0.82em; }
  .np .hidden { display: none; }
</style>

<div class="np">
  <p class="intro" id="intro"></p>
  <p class="scope" id="scope"></p>

  <div class="addon">
    <b id="addonTitle"></b>
    <ol>
      <li><span id="addonStep1"></span> <a id="addonLink" target="_blank" rel="noopener"></a></li>
      <li id="addonStep2"></li>
      <li id="addonStep3"></li>
      <li id="addonStep4"></li>
    </ol>
  </div>

  <label for="issueToken" id="issueTokenLabel"></label>
  <textarea id="issueToken" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>

  <label for="cookie" id="cookieLabel"></label>
  <textarea id="cookie" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>

  <div id="chromeWarn" class="chrome-warn hidden"></div>

  <div class="buttons">
    <button type="button" id="test"></button>
    <button type="button" id="save" class="primary"></button>
  </div>

  <div id="result"></div>

  <details>
    <summary id="troubleTitle"></summary>
    <ul>
      <li id="trouble1"></li>
      <li id="trouble2"></li>
    </ul>
  </details>

  <details>
    <summary id="manualTitle"></summary>
    <label for="curl" id="curlLabel"></label>
    <textarea id="curl" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
    <div id="curlNote" class="scope" style="margin:6px 0 0; min-height:1em;"></div>
    <ol>
      <li id="step1"></li>
      <li id="step2"></li>
      <li id="step3"></li>
      <li id="step4"></li>
      <li id="step5"></li>
    </ol>
    <p class="scope" id="manualNote" style="margin-top:8px"></p>
  </details>

  <div class="why"><b id="chromeTitle"></b> <span id="chromeText"></span></div>
</div>

<script type="text/javascript">
// Egen funksjon: alle visninger i en sesjon deler ett globalt skop, og to som
// deklarerer samme navn med const dreper hele skriptet.
(function () {
  var resultEl = document.getElementById('result');

  function show(text, cls) {
    resultEl.textContent = text;
    resultEl.className = cls || '';
  }

  function t(key) { return Homey.__('pair.' + key); }

  window.onerror = function (message, source, line) {
    show(t('scriptError') + message + ' (' + line + ')', 'bad');
    return false;
  };

  try { Homey.setTitle(t('repairTitle')); } catch (error) { /* pynt */ }

  var issueTokenEl = document.getElementById('issueToken');
  var cookieEl = document.getElementById('cookie');
  var testBtn = document.getElementById('test');
  var saveBtn = document.getElementById('save');

  document.getElementById('intro').textContent = t('repairIntro');
  document.getElementById('scope').textContent = t('repairScope');
  // Tekstene har samme id som nøkkelen i pair-seksjonen.
  var textIds = ['addonTitle', 'addonStep1', 'addonStep2', 'addonStep3', 'addonStep4',
    'troubleTitle', 'trouble1', 'trouble2', 'manualTitle', 'curlLabel', 'manualNote',
    'chromeTitle', 'chromeText', 'chromeWarn', 'step1', 'step2', 'step3', 'step4', 'step5'];
  for (var i = 0; i < textIds.length; i++) {
    document.getElementById(textIds[i]).textContent = t(textIds[i]);
  }
  // Firefox, ikke Chrome: Chrome på Windows binder Google-økten til maskinens
  // TPM, og verdier kopiert derfra dør etter rundt to og en halv time.
  var addonLink = document.getElementById('addonLink');
  addonLink.textContent = t('addonLink');
  addonLink.href = 'https://addons.mozilla.org/firefox/addon/nest-protect-for-homey/';
  document.getElementById('curlNote').textContent = '';
  document.getElementById('curl').placeholder = t('curlPlaceholder');
  document.getElementById('issueTokenLabel').textContent = t('issueToken');
  document.getElementById('cookieLabel').textContent = t('cookie');
  testBtn.textContent = t('test');
  saveBtn.textContent = t('save');

  // Bare Chrome setter fedcm_enabled=true i issueToken-adressen.
  var chromeWarnEl = document.getElementById('chromeWarn');
  function checkBrowser() {
    var fromChrome = issueTokenEl.value.indexOf('fedcm_enabled=true') >= 0;
    chromeWarnEl.className = fromChrome ? 'chrome-warn' : 'chrome-warn hidden';
  }
  issueTokenEl.addEventListener('input', checkBrowser);

  // Begge feltene fylles ut. Et tomt cookie-felt så ut som om legitimasjonen
  // var borte, og gjorde et trykk på Lagre til en feilmelding i stedet for en
  // reparasjon. Marker alt i feltet og lim over med den nye verdien.
  cookieEl.placeholder = t('cookiePlaceholder');
  Homey.emit('getCredentials', null, function (error, value) {
    if (error || !value) return;
    if (value.issueToken) issueTokenEl.value = value.issueToken;
    if (value.cookie) cookieEl.value = value.cookie;
    checkBrowser();
  });

  function busy(on) {
    testBtn.disabled = on;
    saveBtn.disabled = on;
  }

  function values() {
    return {
      issueToken: issueTokenEl.value.trim(),
      cookie: cookieEl.value.trim()
    };
  }

  // Lim inn «Kopier som cURL» fra utviklerverktøyene, så fylles feltene ut. Samme
  // tolkning som lib/curl-paste.js; visningen kan ikke importere moduler.
  function stripCaret(text) {
    var s = String(text || '');
    s = s.split('^\r\n').join(' ').split('^\n').join(' ');
    s = s.split('\\r\n').join(' ').split('\\n').join(' ');
    var out = '';
    for (var i = 0; i < s.length; i++) {
      if (s.charAt(i) === '^' && i + 1 < s.length) { out += s.charAt(i + 1); i++; }
      else out += s.charAt(i);
    }
    return out;
  }
  function quotedAfter(s, from) {
    var i = from;
    while (i < s.length && (s.charAt(i) === ' ' || s.charAt(i) === '\t')) i++;
    var q = s.charAt(i);
    if (q !== "'" && q !== '"') return '';
    var close = s.indexOf(q, i + 1);
    return close < 0 ? '' : s.slice(i + 1, close);
  }
  function parseCurl(input) {
    var s = ' ' + stripCaret(input);
    var mark = 'https://accounts.google.com/o/oauth2/iframerpc?';
    var start = s.indexOf(mark), token = '';
    if (start >= 0) {
      var end = start;
      while (end < s.length) {
        var ch = s.charAt(end);
        if (ch === "'" || ch === '"' || ch === ' ' || ch === '\n' || ch === '\r' || ch === '\t') break;
        end++;
      }
      token = s.slice(start, end);
    }
    var cookie = '', marks = [' -b ', ' --cookie ', '\n-b ', '\n--cookie '];
    for (var m = 0; m < marks.length; m++) {
      var at = s.indexOf(marks[m]);
      if (at >= 0) { var v = quotedAfter(s, at + marks[m].length); if (v) { cookie = v.trim(); break; } }
    }
    // Firefox legger cookien i en header, -H "Cookie: …", ikke i -b.
    if (!cookie) {
      var lower = s.toLowerCase(), c = lower.indexOf('cookie:');
      while (c >= 0) {
        var q = s.charAt(c - 1);
        if (q === "'" || q === '"') {
          var shut = s.indexOf(q, c);
          if (shut > c) { cookie = s.slice(c + 7, shut).trim(); break; }
        }
        c = lower.indexOf('cookie:', c + 7);
      }
    }
    return { issueToken: token, cookie: cookie };
  }

  var curlEl = document.getElementById('curl');
  var curlNoteEl = document.getElementById('curlNote');
  curlEl.addEventListener('input', function () {
    var raw = curlEl.value;
    if (!raw.trim()) { curlNoteEl.textContent = ''; return; }
    var parsed = parseCurl(raw);
    if (parsed.issueToken) issueTokenEl.value = parsed.issueToken;
    if (parsed.cookie) cookieEl.value = parsed.cookie;
    checkBrowser();
    curlNoteEl.textContent = (parsed.issueToken && parsed.cookie) ? t('curlOk') : t('curlMiss');
  });

  testBtn.addEventListener('click', function () {
    busy(true);
    show(t('testing'), '');
    Homey.emit('testCredentials', values(), function (error, result) {
      busy(false);
      if (error) { show(error.message || String(error), 'bad'); return; }
      show(t('testOk').replace('__count__', String(result.deviceCount)), 'ok');
    });
  });

  saveBtn.addEventListener('click', function () {
    busy(true);
    show(t('saving'), '');
    Homey.emit('saveCredentials', values(), function (error) {
      busy(false);
      if (error) { show(error.message || String(error), 'bad'); return; }
      show(t('saved'), 'ok');
      // Enheten er allerede lagt til; vi avslutter bare sesjonen. Appen kobler
      // til på nytt av seg selv når innstillingene endres.
      setTimeout(function () { Homey.done(); }, 1200);
    });
  });
})();
</script>
